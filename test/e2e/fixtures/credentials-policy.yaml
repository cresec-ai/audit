# Fixture policy for the credential-swap e2e (test/e2e/credential-swap.e2e.test.ts).
#
# THE SCHEMA BELOW IS AN ASSUMPTION. At the time this suite was written the
# broker (src/broker/) and the policy's `credentials:` section were being
# built in parallel, so these key names encode the agreed CONTRACT rather than
# a schema anyone had shipped:
#
#   - the swap is DESTINATION-BOUND: it happens at a declared
#     (tool, argument dot-path) site and nowhere else, so a tool that merely
#     reflects the synthetic back gets the synthetic, not the credential;
#   - the request's `host` is derived from the CALL's own arguments (here the
#     `url` argument), not from the static server name, and the site is
#     constrained to a host glob — a site with no host constraint is a policy
#     error, not a default-allow;
#   - the SOURCE is named only by configuration, never by the call.
#
# If the implementation chose different key names, EDIT THIS FILE ONLY. The
# test asserts behaviour (what reached the server, what reached the client,
# what reached the chain), not schema, and skips itself with a reason when
# `mcp-recorder policy validate` rejects this file — so a rename shows up as a
# skip, never as a false green.
#
# Environment the test sets around it:
#   E2E_SYNTHETIC   the synthetic the agent holds (NHI format, cresec_synth_v1_…)
#   E2E_REAL_TOKEN  the real credential — the canary that must never be stored
version: 1
name: e2e-credentials
mcp:
  default: allow
  boundary: { secrets: redact, injection: flag }
credentials:
  - id: e2e-post-token
    label: e2e demo posting token
    # Where the recorder learns which synthetic to accept. Kept out of the
    # policy body so the file can be world-readable evidence of the rules
    # without being a copy of the credential material.
    synthetic_env: E2E_SYNTHETIC
    # The source is resolved on this machine; `env` is the CI-testable one.
    source:
      type: env
      name: E2E_REAL_TOKEN
    # The only place a swap may happen.
    sites:
      - tool: post_message
        arg: headers.Authorization
        # Everything below is the DESTINATION half of the decision.
        host:
          from_arg: url
          allow: [api.example.test]
        path_template_from_arg: url
