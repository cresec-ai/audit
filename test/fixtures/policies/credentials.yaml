# A credentials section exercising every host binding (argument / declared /
# server name), both path bindings, a deny carve-out ordered before the allow
# it narrows, and four of the seven sources.
version: 1
name: credentials-example

mcp:
  default: deny
  rules:
    - id: github-writes
      match:
        server: corp-notes
        tool: [http_post, http_delete]
      action: allow
    - id: reads
      match:
        tool: "read_*"
      action: allow

credentials:
  - id: github-issues
    provider: github
    scopes: ["repo:issues"]
    ttl_seconds: 30
    timeout_ms: 5000
    on_unresolved: deny
    source:
      type: env
      var: GITHUB_TOKEN
    use:
      # First match wins, so the carve-out is written above the site it narrows.
      - id: no-deletes
        server: corp-notes
        tool: http_delete
        arg: headers.Authorization
        host:
          from_arg: url
          allow: ["api.github.com"]
        action: deny
        reason: "an issues token does not delete things"
      - id: create-issue
        server: corp-notes
        tool: http_post
        arg: headers.Authorization
        host:
          from_arg: url
          allow: ["api.github.com", "*.github.com"]

  - id: clickup-api
    provider: clickup
    scopes: ["tasks:write"]
    source:
      type: clickup
      token_env: CLICKUP_API_TOKEN
      team_id: "9012345678"
    use:
      - id: tasks
        server: clickup
        tool: "clickup_*"
        arg: token
        host:
          fixed: api.clickup.com
        path:
          from_arg: list_id
          allow: ["901*"]

  - id: db-readonly
    provider: postgres
    scopes: [select]
    ttl_seconds: 0
    source:
      type: vault
      path: secret/data/db/readonly
      field: password
      addr: https://openbao.internal:8200
      token_env: VAULT_TOKEN
    use:
      # A stdio server with one fixed upstream and no destination argument:
      # the host is the server name, and the decision says so.
      - id: query
        server: db
        tool: query
        arg: connection.password
        host:
          from: server

  - id: npm-publish
    provider: npm
    source:
      type: exec
      command: /usr/bin/op
      args: [read, "op://dev/npm/token"]
    use:
      - id: publish
        server: npm
        tool: publish
        arg: auth.token
        host:
          fixed: registry.npmjs.org

  - id: stripe-readonly
    provider: stripe
    source:
      type: file
      path: /etc/mcp-recorder/stripe.json
      field: keys.restricted
    use:
      - id: charges
        tool: "stripe_*"
        arg: headers.Authorization
        host:
          fixed: api.stripe.com
