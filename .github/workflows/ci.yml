name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.x is the package's declared minimum (engines: >=18.17) and, unlike
        # 20.x/22.x, does NOT define globalThis.crypto by default — it's the
        # real-environment check that key generation/signing/verification stay
        # on @noble/ed25519's sync API (see src/chain/keys.ts). better-sqlite3
        # 11 and vitest 2 both support Node 18.
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  bench-smoke:
    name: bench smoke (node 20)
    runs-on: ubuntu-latest
    # Latency numbers are jittery on shared runners; this job is informational.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bench smoke
        run: npm run bench -- --smoke
