name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is no longer supported (engines: >=20). We still cover
        # 20.x/22.x/24.x; the ed25519 code deliberately keeps using
        # @noble/ed25519's sync API (see src/chain/keys.ts), not the
        # globalThis.crypto-backed async one.
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: dist/ is committed and current
        run: git diff --exit-code --stat -- dist
      - name: Test
        run: npm test

  test-windows:
    name: test (windows, node 22.x)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: dist/ is committed and current
        run: git diff --exit-code --stat -- dist
      - name: Test
        run: npm test

  bench-smoke:
    name: bench smoke (node 20)
    runs-on: ubuntu-latest
    # Latency numbers are jittery on shared runners; this job is informational.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bench smoke
        run: npm run bench -- --smoke
